[project]
name = "mediflight-ai"
version = "0.2.0"
description = "MediFlight AI: mission-based reinforcement learning for multi-stop medical drone delivery (DQN, REINFORCE, A2C, PPO with TorchRL)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.0,<2",
    "numpy>=1.26,<3",
    "torch>=2.3",
    # The training code is written against the TorchRL 0.15 API (e.g. `Collector`,
    # which replaced `SyncDataCollector`). Pin the minor version to avoid API drift.
    "torchrl>=0.15,<0.16",
    "tensordict>=0.15,<0.16",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# Linux/Windows markers get CPU-only PyTorch wheels (much smaller than CUDA builds);
# macOS uses the default PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
